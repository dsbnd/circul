global
    maxconn 256

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend booking_frontend
    bind "127.0.0.1:${BOOKING_LOAD_BALANCER_PORT-8085}"
    default_backend booking_instances

backend booking_instances
    balance roundrobin
    option httpchk GET /booking/actuator/health
    http-check expect status 200
    http-response set-header X-Booking-Instance %[srv_name]
    server booking-1 "127.0.0.1:${BOOKING_INSTANCE_1_PORT-8082}" check
    server booking-2 "127.0.0.1:${BOOKING_INSTANCE_2_PORT-8083}" check

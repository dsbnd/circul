server:
  port: ${API_GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway

eureka:
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

zuul:
  ignored-services: '*'
  routes:
    ticket-service:
      path: /api/v1/**
      service-id: ticket-service
      strip-prefix: false
      sensitive-headers:
    booking-service:
      path: /booking/**
      url: ${BOOKING_LOAD_BALANCER_URL:http://localhost:8085}
      strip-prefix: false
      sensitive-headers:
  ribbon:
    eager-load:
      enabled: true
  host:
    connect-timeout-millis: 5000
    socket-timeout-millis: 10000

ribbon:
  ConnectTimeout: 5000
  ReadTimeout: 10000
  ServerListRefreshInterval: 5000
  eureka:
    enabled: true

hystrix:
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 15000

management:
  endpoints:
    web:
      exposure:
        include: health,info,routes
